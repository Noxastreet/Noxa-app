<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your NOXA account</title>
  </head>
  <body style="margin:0;background:#08090c;color:#f4f4f6;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width:520px;background:#111318;border:1px solid #272a31;border-radius:20px;"
          >
            <tr>
              <td style="padding:36px 32px;">
                <p
                  style="margin:0 0 32px;color:#f4f4f6;font-size:20px;font-weight:800;letter-spacing:4px;"
                >
                  NOXA
                </p>
                <h1 style="margin:0;color:#f4f4f6;font-size:30px;line-height:38px;">
                  Confirm your email
                </h1>
                <p style="margin:14px 0 28px;color:#a7a9b0;font-size:16px;line-height:25px;">
                  One last step to activate your NOXA account.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="border-radius:12px;background:#d20f32;">
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="display:inline-block;padding:15px 24px;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;"
                      >
                        Confirm email address
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0;color:#737680;font-size:13px;line-height:20px;">
                  If you did not create a NOXA account, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
