name: Apply consolidated UX patch

on:
  push:
    branches:
      - codex/group-drive-ux-simplification-20260902
    paths:
      - scripts/apply-consolidated-ux.mjs
      - .github/workflows/apply-consolidated-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/group-drive-ux-simplification-20260902
          fetch-depth: 0

      - name: Apply deterministic patch
        run: node scripts/apply-consolidated-ux.mjs

      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app src
          git commit -m "feat(mvp): apply consolidated navigation and identity UX"
          git push origin HEAD:codex/group-drive-ux-simplification-20260902
