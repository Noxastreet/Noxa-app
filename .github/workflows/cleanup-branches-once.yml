name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#refs/heads/##' \
            | while IFS= read -r branch; do
                if [ "$branch" = "main" ]; then
                  continue
                fi
                echo "Deleting $branch"
                git push origin --delete "$branch"
              done

      - name: Remove this one-time workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-branches-once.yml
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:main
