name: Compact profile no-photo card

on:
  push:
    branches:
      - codex/group-drive-ux-simplification-20260902
    paths:
      - scripts/compact-profile-no-photo-card.mjs
      - .github/workflows/compact-profile-no-photo-card.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/group-drive-ux-simplification-20260902
          fetch-depth: 0
      - run: node scripts/compact-profile-no-photo-card.mjs
      - name: Commit profile no-photo card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/profile.tsx'
          git diff --cached --quiet && exit 0
          git commit -m "refactor(profile): compact vehicle card without photo"
          git push origin HEAD:codex/group-drive-ux-simplification-20260902