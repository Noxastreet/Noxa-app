name: Apply T8 GPS permission reconciliation patch

on:
  push:
    branches:
      - fix/audit-t8-gps-permission-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-t8-gps-permission-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact scoped replacements
        run: node scripts/apply-t8-gps-permission-reconcile.mjs
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Verify Group Drive Phase 3B static contract
        run: npm run verify:group-drive-phase-3b
      - name: Run deterministic native Group Drive smoke
        run: npm run test:group-drive-phase-3b
      - name: Verify patch whitespace
        run: git diff --check
      - name: Remove temporary helper
        run: git rm scripts/apply-t8-gps-permission-reconcile.mjs
      - name: Commit patched runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(t8): reconcile revoked Group Drive GPS permission"
          git push origin HEAD:fix/audit-t8-gps-permission-reconcile
