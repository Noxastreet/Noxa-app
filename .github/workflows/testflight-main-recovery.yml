name: TestFlight Main Recovery

on:
  push:
    branches:
      - recovery/testflight-main-20260922

concurrency:
  group: testflight-main-recovery-20260922
  cancel-in-progress: true

jobs:
  verify-build-submit:
    name: Verify main baseline, local iOS build, submit
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
      EXPECTED_MAIN_SHA: "0f225d07da3f6e3d9e622798d48242de431a1763"
      IPA_PATH: "${{ github.workspace }}/artifacts/noxa-main-recovery.ipa"

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove product code equals main baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "Expected main: $EXPECTED_MAIN_SHA"
          CHANGED="$(git diff --name-only "$EXPECTED_MAIN_SHA" HEAD)"
          echo "Files changed from main:"
          printf '%s\n' "$CHANGED"
          if [ "$CHANGED" != ".github/workflows/testflight-main-recovery.yml" ]; then
            echo "Product code differs from main. Refusing to build."
            exit 1
          fi

      - name: Verify Expo token is configured
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recovery static gate
        run: |
          npx tsc --noEmit
          npm run lint
          npx expo-doctor

      - name: Print native toolchain
        run: |
          xcodebuild -version
          ruby --version
          pod --version
          node --version
          npm --version

      - name: Build production IPA locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$IPA_PATH")"
          npx eas-cli@latest build             --platform ios             --profile production             --local             --non-interactive             --output "$IPA_PATH"
          test -f "$IPA_PATH"
          ls -lh "$IPA_PATH"

      - name: Submit local IPA to TestFlight
        run: |
          npx eas-cli@latest submit             --platform ios             --profile production             --path "$IPA_PATH"             --non-interactive             --wait

      - name: Preserve IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noxa-main-recovery-ipa
          path: artifacts/noxa-main-recovery.ipa
          if-no-files-found: ignore
          retention-days: 3
