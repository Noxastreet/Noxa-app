name: Dependency Security Safe Fix

on:
  push:
    branches:
      - fix/dependency-security-20260914

permissions:
  contents: write

jobs:
  safe-fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install locked dependencies
        run: npm ci

      - name: Apply only non-breaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Ensure package.json was not changed
        run: git diff --exit-code -- package.json

      - name: Reinstall from remediated lockfile
        run: npm ci

      - name: Production audit after remediation
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-prod-after.json
          status=$?
          echo "PROD_AUDIT_EXIT=$status"
          cat npm-audit-prod-after.json
          exit 0

      - name: Full audit after remediation
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-full-after.json
          status=$?
          echo "FULL_AUDIT_EXIT=$status"
          cat npm-audit-full-after.json
          exit 0

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Expo doctor
        run: npx expo-doctor

      - name: T9 performance contract
        run: npm run verify:t9-performance-pass

      - name: Group Drive Phase 5
        run: npm run verify:group-drive-phase-5

      - name: MVP completion
        run: npm run verify:mvp-completion

      - name: Diff check
        run: git diff --check

      - name: Upload post-fix audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-safe-fix-reports
          path: |
            npm-audit-prod-after.json
            npm-audit-full-after.json

      - name: Commit safe lockfile remediation if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile remediation changes remain."
            exit 0
          fi
          git add package-lock.json
          git commit -m "fix(deps): apply non-breaking npm audit remediation"
          git push origin HEAD:fix/dependency-security-20260914
