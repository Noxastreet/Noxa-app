name: TestFlight PR 305

on:
  push:
    branches:
      - feat/map-contextual-flows-20260919

concurrency:
  group: testflight-pr305
  cancel-in-progress: true

jobs:
  build-and-submit:
    name: Build and submit iOS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Verify Expo token is configured
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print build checkpoint
        run: |
          echo "Git SHA: $GITHUB_SHA"
          node -e "const e=require('./eas.json'); console.log('EAS production environment:', e.build.production.environment); console.log('ASC app id:', e.submit.production.ios.ascAppId)"

      - name: Build iOS and submit to TestFlight
        run: npx eas-cli@latest build --platform ios --profile production --auto-submit --non-interactive
