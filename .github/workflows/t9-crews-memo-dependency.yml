name: Fix T9 Crews memo dependency

on:
  push:
    branches:
      - t9/acceptance-integration-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t9/acceptance-integration-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add missing error dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/crews-events/CanonicalCrewsScreen.tsx')
          s = p.read_text()
          old = '''  }, [\n    busyCrewId,\n    discovery.length,'''
          new = '''  }, [\n    busyCrewId,\n    error,\n    discovery.length,'''
          if old not in s:
              raise SystemExit('dependency anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Run all T8 verifiers
        run: |
          set -euo pipefail
          for verifier in scripts/verify-t8-*.mjs; do
            [[ -e "$verifier" ]] || continue
            node "$verifier"
          done
      - run: npm run verify:group-drive-phase-5
      - run: npm run verify:mvp-completion
      - run: git diff --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/crews-events/CanonicalCrewsScreen.tsx
          git commit -m "fix(t9): keep Crews error state memo reactive"
          git push origin HEAD:t9/acceptance-integration-20260914
