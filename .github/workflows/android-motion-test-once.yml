name: Android Motion Test Build Once

on:
  push:
    branches:
      - ci/android-motion-test-20261003
    paths:
      - .github/workflows/android-motion-test-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: android-motion-test-20261003
  cancel-in-progress: false

jobs:
  build:
    name: Verify exact main and build installable Android APK
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      EXPECTED_CANDIDATE_SHA: "498e15f743c20bb3adee5e4d35708ff8e92ee298"
      EXPECTED_WORKFLOW_PATH: ".github/workflows/android-motion-test-once.yml"

    steps:
      - name: Check out delivery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove delivery branch is exact main plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          PARENT_SHA="$(git rev-parse HEAD^)"
          test "$PARENT_SHA" = "$EXPECTED_CANDIDATE_SHA"
          CHANGED="$(git diff --name-only "$EXPECTED_CANDIDATE_SHA" HEAD)"
          test "$CHANGED" = "$EXPECTED_WORKFLOW_PATH"

      - name: Require unchanged canonical main and green Quality
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api repos/Noxastreet/Noxa-app/branches/main --jq '.commit.sha')"
          test "$CURRENT_MAIN" = "$EXPECTED_CANDIDATE_SHA"
          gh api "repos/Noxastreet/Noxa-app/actions/runs?head_sha=$EXPECTED_CANDIDATE_SHA&per_page=30"             --jq '.workflow_runs[] | select(.name == "Quality" and .event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success") | .id'             > "$RUNNER_TEMP/quality-success"
          test -s "$RUNNER_TEMP/quality-success"

      - name: Check out exact product source
        uses: actions/checkout@v4
        with:
          ref: 498e15f743c20bb3adee5e4d35708ff8e92ee298
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-run Android-critical gates
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run lint
          npx expo-doctor
          npm run verify:ui-foundation
          npm run verify:motion-foundation
          npm run verify:interactions
          npm run verify:event-drive-together
          npm run verify:drive-together-motion
          npm run verify:drive-together-quickflow
          node ./scripts/verify-live-drive-presence.mjs
          node ./scripts/verify-map-location-revocation.mjs

      - name: Add ephemeral Android test profile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'eas.json';
          const eas = JSON.parse(fs.readFileSync(path, 'utf8'));
          eas.build['android-test'] = {
            extends: 'production',
            distribution: 'internal',
            environment: 'production',
            android: {
              buildType: 'apk'
            }
          };
          fs.writeFileSync(path, JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Build signed Android APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes eas-cli@24.7.0 build             --platform android             --profile android-test             --non-interactive             --wait             --json > artifacts/eas-android-build.json

      - name: Download exact APK
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('artifacts/eas-android-build.json', 'utf8').trim();
          const start = raw.indexOf('[');
          const end = raw.lastIndexOf(']');
          if (start < 0 || end < start) throw new Error('Could not parse EAS build JSON');
          const builds = JSON.parse(raw.slice(start, end + 1));
          const build = builds[0];
          if (!build?.id) throw new Error('Missing EAS build id');
          const url = build?.artifacts?.applicationArchiveUrl;
          if (!url) throw new Error('Missing APK artifact URL');
          fs.writeFileSync('artifacts/android-build-metadata.json', JSON.stringify({
            source: process.env.EXPECTED_CANDIDATE_SHA,
            easBuildId: build.id,
            status: build.status,
            platform: build.platform,
            appVersion: build.appVersion,
            appBuildVersion: build.appBuildVersion,
            artifactUrl: url
          }, null, 2));
          fs.appendFileSync(process.env.GITHUB_ENV, 'APK_URL=' + url + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'EAS_BUILD_ID=' + build.id + '\n');
          NODE
          curl --fail --location "$APK_URL" --output artifacts/noxa-android-motion-test.apk
          test -s artifacts/noxa-android-motion-test.apk
          sha256sum artifacts/noxa-android-motion-test.apk > artifacts/android-apk-sha256.txt
          ls -lh artifacts/noxa-android-motion-test.apk

      - name: Preserve Android test build
        uses: actions/upload-artifact@v4
        with:
          name: noxa-android-motion-test-${{ github.run_id }}
          path: |
            artifacts/noxa-android-motion-test.apk
            artifacts/android-build-metadata.json
            artifacts/android-apk-sha256.txt
            artifacts/eas-android-build.json
          if-no-files-found: error
          retention-days: 7
