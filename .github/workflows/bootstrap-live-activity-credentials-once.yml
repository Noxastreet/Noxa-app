name: Bootstrap Live Activity Credentials Once

on:
  push:
    branches:
      - ci/bootstrap-live-activity-credentials-20261001
    paths:
      - .github/workflows/bootstrap-live-activity-credentials-once.yml

permissions:
  contents: read

concurrency:
  group: bootstrap-live-activity-credentials-once-20261001
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Configure NoxaDriveActivity signing credentials
    if: ${{ github.run_attempt == 1 }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NO_COLOR: "1"
      FORCE_COLOR: "0"
      EXPO_APPLE_TEAM_ID: "V8H92SG76B"
      EXPO_APPLE_TEAM_TYPE: "INDIVIDUAL"
      EXPECTED_CANDIDATE_SHA: "f6bd16aab67889830308c375bc2a67bc7ecf69e1"
      EXPECTED_MAIN_SHA: "879bf6681f88a1a4756abd5ce9ce13130bbab3c6"
      EXPECTED_WORKFLOW_PATH: ".github/workflows/bootstrap-live-activity-credentials-once.yml"

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove bootstrap branch is exact candidate plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_CANDIDATE_SHA" HEAD
          CHANGED="$(git diff --name-only "$EXPECTED_CANDIDATE_SHA" HEAD)"
          test "$CHANGED" = "$EXPECTED_WORKFLOW_PATH"

      - name: Require unchanged canonical main and exact open PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/Noxastreet/Noxa-app/branches/main --jq '.commit.sha')" = "$EXPECTED_MAIN_SHA"
          gh api repos/Noxastreet/Noxa-app/pulls/368 > "$RUNNER_TEMP/pr.json"
          node - <<'NODE'
          const fs = require('fs');
          const pr = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pr.json','utf8'));
          if (pr.state !== 'open') throw new Error('PR #368 is not open');
          if (pr.head.sha !== process.env.EXPECTED_CANDIDATE_SHA) throw new Error('PR #368 head changed');
          console.log('Exact PR368 candidate confirmed');
          NODE

      - name: Check out exact product candidate
        uses: actions/checkout@v4
        with:
          ref: f6bd16aab67889830308c375bc2a67bc7ecf69e1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project with Live Activity target
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Confirm expect is available
        shell: bash
        run: |
          set -euo pipefail
          command -v expect
          expect -v

      - name: Load existing EAS App Store Connect API key securely
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const endpoint = 'https://api.expo.dev/graphql';
          const token = process.env.EXPO_TOKEN;
          if (!token) throw new Error('EXPO_TOKEN is unavailable');

          async function gql(query, variables) {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                authorization: 'Bearer ' + token,
              },
              body: JSON.stringify({ query, variables }),
            });
            const body = await res.json();
            if (!res.ok || body.errors) {
              throw new Error('EAS GraphQL request failed: ' + JSON.stringify(body.errors ?? res.status));
            }
            return body.data;
          }

          const identifierData = await gql(`
            query AppleAppIdentifierByBundleIdQuery($accountName: String!, $bundleIdentifier: String!) {
              account {
                byName(accountName: $accountName) {
                  appleAppIdentifiers(bundleIdentifier: $bundleIdentifier) { id }
                }
              }
            }
          `, {
            accountName: 'noxastreet',
            bundleIdentifier: 'com.karaketidis.noxa',
          });
          const appleAppIdentifierId =
            identifierData?.account?.byName?.appleAppIdentifiers?.[0]?.id;
          if (!appleAppIdentifierId) throw new Error('Main Apple app identifier is unavailable');

          const credentialsData = await gql(`
            query ExistingAscKeyRef($projectFullName: String!, $appleAppIdentifierId: String!) {
              app {
                byFullName(fullName: $projectFullName) {
                  iosAppCredentials(filter: { appleAppIdentifierId: $appleAppIdentifierId }) {
                    appStoreConnectApiKeyForSubmissions { id }
                  }
                }
              }
            }
          `, {
            projectFullName: '@noxastreet/Noxa',
            appleAppIdentifierId,
          });
          const ascId =
            credentialsData?.app?.byFullName?.iosAppCredentials?.[0]
              ?.appStoreConnectApiKeyForSubmissions?.id;
          if (!ascId) throw new Error('Stored App Store Connect API key reference is unavailable');

          const keyData = await gql(`
            query AppStoreConnectApiKeyById($ascApiKeyId: ID!) {
              appStoreConnectApiKey {
                byId(id: $ascApiKeyId) {
                  issuerIdentifier
                  keyIdentifier
                  keyP8
                }
              }
            }
          `, { ascApiKeyId: ascId });
          const key = keyData?.appStoreConnectApiKey?.byId;
          if (!key?.keyP8 || !key?.keyIdentifier || !key?.issuerIdentifier) {
            throw new Error('Stored App Store Connect API key is incomplete for provisioning access');
          }

          const keyPath = process.env.RUNNER_TEMP + '/noxa-asc-key.p8';
          fs.writeFileSync(keyPath, key.keyP8, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, 'EXPO_ASC_API_KEY_PATH=' + keyPath + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'EXPO_ASC_KEY_ID=' + key.keyIdentifier + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'EXPO_ASC_ISSUER_ID=' + key.issuerIdentifier + '\n');
          console.log('VERIFIED: existing EAS ASC API key loaded into ephemeral runner environment');
          NODE

      - name: Configure missing extension signing credentials once
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          expect <<'EXPECT_EOF'
          set timeout 300
          log_user 1
          spawn npx --yes eas-cli@24.7.0 credentials:configure-build -p ios -e production
          expect {
            -re {(?i)Reuse.*distribution certificate} {
              send "\r"
              exp_continue
            }
            -re {(?i)Generate.*Provisioning Profile} {
              send "\r"
              exp_continue
            }
            -re {(?i)Do you want to log in to your Apple account} {
              puts stderr "Unexpected Apple login prompt; refusing interactive account login in CI"
              exit 31
            }
            -re {(?i)Apple ID:} {
              puts stderr "Unexpected Apple ID prompt; refusing credentials entry in CI"
              exit 32
            }
            -re {(?i)mobileprovision|Path to.*Provisioning Profile} {
              puts stderr "Unexpected manual provisioning-profile prompt; refusing manual credential upload"
              exit 33
            }
            eof {
              catch wait result
              set code [lindex $result 3]
              exit $code
            }
            timeout {
              puts stderr "Timed out on an unrecognized EAS credentials prompt"
              exit 34
            }
          }
          EXPECT_EOF
