name: NOXA TestFlight Motion Status

on:
  push:
    branches:
      - ops/testflight-motion-20260930
    paths:
      - .github/workflows/testflight-motion.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out canonical NOXA main
        uses: actions/checkout@v4
        with:
          ref: 20bc16350c1e30d225204a940f0d521eb53ee7e2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: View build 62 submission
        run: npx --yes eas-cli@latest submit:view 7cc2ea55-82d0-418a-8a97-07220f6999f5 --json

      - name: View TestFlight status
        run: npx --yes eas-cli@latest submit:status --platform ios --profile production --json --non-interactive
