name: TestFlight Final Release Candidate 2026-10-02

on:
  push:
    branches:
      - release/testflight-final-20261002

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: 2540081d701398ebf1cf0099ddbb6b8b5038b52d

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Expo auth
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN_MISSING"
            exit 20
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build and submit exact iOS production candidate
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --auto-submit
