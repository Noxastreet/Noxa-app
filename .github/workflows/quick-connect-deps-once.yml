name: Quick Connect deps once

on:
  push:
    branches:
      - feat/quick-connect-friends-20260929
    paths:
      - .github/workflows/quick-connect-deps-once.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quick-connect-friends-20260929
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Quick Connect dependencies
        run: |
          npx expo install expo-camera
          npm install react-native-qrcode-svg
      - name: Commit lockfile changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "chore(social): add Quick Connect QR dependencies"
          git push origin HEAD:feat/quick-connect-friends-20260929
