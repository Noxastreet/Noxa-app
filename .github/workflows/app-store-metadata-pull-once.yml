name: NOXA App Store Metadata Pull Once

on:
  push:
    branches:
      - fix/release-blockers-20261003
    paths:
      - .github/workflows/app-store-metadata-pull-once.yml

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a4d687f6d4ea45d011cba53ba57b571fe276a4c
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull current App Store metadata
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f store.config.json
          npx --yes eas-cli@24.7.0 metadata:pull --profile production --non-interactive
          test -f store.config.json
          echo "----- STORE CONFIG BEGIN -----"
          cat store.config.json
          echo "----- STORE CONFIG END -----"
