name: Build T9 acceptance integration

on:
  push:
    branches:
      - t9/acceptance-integration-20260914

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t9/acceptance-integration-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch reviewed T8 branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Apply reviewed product and verifier diffs
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            fix/audit-t8-create-crew-owner
            fix/audit-t8-core-truth-accessibility
            fix/audit-t8-unsaved-editors-v2
            fix/audit-t8-detail-retry-v2
            fix/audit-t8-event-route-consistency
            fix/audit-t8-crew-filter-preservation
            fix/audit-t8-gps-permission-reconcile
            fix/audit-t8-core-touch-targets
            fix/audit-t8-active-drive-foreground-reconcile
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for branch in "${branches[@]}"; do
            safe="${branch//\//-}"
            patch="/tmp/${safe}.patch"
            git diff --binary origin/main..."origin/${branch}" -- . ':(exclude)package.json' ':(exclude).github/workflows/quality.yml' > "${patch}"
            if [[ ! -s "${patch}" ]]; then
              echo "No integration diff for ${branch}; skipping."
              continue
            fi
            echo "Applying ${branch}"
            git apply --3way "${patch}"
            git add -A
            if git diff --cached --quiet; then
              echo "${branch} already represented; skipping commit."
            else
              git commit -m "chore(t9): integrate ${branch}"
            fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Expo doctor
        run: npx expo-doctor
      - name: Run every T8 verifier present in candidate
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for verifier in scripts/verify-t8-*.mjs; do
            [[ -e "$verifier" ]] || continue
            echo "==> $verifier"
            node "$verifier"
            count=$((count + 1))
          done
          echo "Executed ${count} T8 verifier scripts."
          test "$count" -ge 8
      - name: Group Drive Phase 5 contract
        run: npm run verify:group-drive-phase-5
      - name: MVP completion and privacy contract
        run: npm run verify:mvp-completion
      - name: Verify whitespace
        run: git diff --check origin/main...HEAD
      - name: Push integration commits
        run: git push origin HEAD:t9/acceptance-integration-20260914
