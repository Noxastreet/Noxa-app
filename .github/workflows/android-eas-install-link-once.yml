name: NOXA Android EAS Install Link Once

on:
  push:
    branches:
      - fix/release-blockers-20261003
    paths:
      - .github/workflows/android-eas-install-link-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: noxa-android-eas-install-link-once-20261003
  cancel-in-progress: false

jobs:
  build:
    name: Build Android install link
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPECTED_CANDIDATE_SHA: "3a4d687f6d4ea45d011cba53ba57b571fe276a4c"
      EXPECTED_WORKFLOW_PATH: ".github/workflows/android-eas-install-link-once.yml"

    steps:
      - name: Check out delivery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove delivery commit only adds this workflow
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only HEAD^ HEAD)"
          printf 'Delivery-only files:\n%s\n' "${CHANGED:-<none>}"
          if [ "$CHANGED" != "$EXPECTED_WORKFLOW_PATH" ]; then
            echo "Delivery commit contains product changes. Refusing to build."
            exit 1
          fi

      - name: Check out exact release candidate
        uses: actions/checkout@v4
        with:
          ref: 3a4d687f6d4ea45d011cba53ba57b571fe276a4c
          fetch-depth: 1

      - name: Prove exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recheck release blocker contract
        run: |
          npx tsc --noEmit
          npm run verify:release-blockers

      - name: Create ephemeral friend-test profile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build['friend-test'] = {
            distribution: 'internal',
            environment: 'production',
            android: { buildType: 'apk' }
          };
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Build on EAS and expose install URL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@24.7.0 build             --platform android             --profile friend-test             --non-interactive             --wait             --json > "$RUNNER_TEMP/eas-build.json"

          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/eas-build.json', 'utf8');
          const data = JSON.parse(raw);
          const build = Array.isArray(data) ? data[0] : data;
          if (!build?.id) throw new Error('EAS build id missing');
          const url = build.buildDetailsPageUrl || ('https://expo.dev/accounts/noxastreet/projects/Noxa/builds/' + build.id);
          console.log('EAS Android install page: ' + url);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### NOXA Android EAS install link\n' +
            '- Source SHA: ' + process.env.EXPECTED_CANDIDATE_SHA + '\n' +
            '- Build ID: ' + build.id + '\n' +
            '- Install page: ' + url + '\n');
          NODE
