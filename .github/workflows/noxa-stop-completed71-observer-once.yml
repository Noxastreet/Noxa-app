name: Stop redundant superseded 71 read-only observer after verified upload
on:
  push:
    branches: [ci/noxa-stop-completed71-observer-20260930]
    paths: [.github/workflows/noxa-stop-completed71-observer-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prove finished same submission before stopping obsolete read-only observer
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/Noxastreet/Noxa-app/';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function get(path){const r=await fetch(root+path,{headers});if(!r.ok)throw new Error('Evidence read failed '+r.status);return r.json();}
          const evidenceRun=await get('actions/runs/36782080342');
          if(evidenceRun.head_sha!=='d6d999794bd87f42f284b05fafa1530914bbf68d'||evidenceRun.conclusion!=='success')throw new Error('Missing independent upload evidence');
          const file=await get('contents/submission-state.json?ref=ci%2Fnoxa-build71-upload-evidence-20260930');
          const state=JSON.parse(Buffer.from(file.content,'base64').toString());
          if(state.id!=='ef7ed8cf-68dd-46ed-b847-cb976b91e996'||state.source!=='432d6bec798b1b7641120f151825ea2ceb5c29d1'||state.status!=='FINISHED'||state.appleUploadConfirmed!==true)throw new Error('Wrong superseded upload evidence');
          const old=await get('actions/runs/36779610857');
          if(old.head_sha!=='0f1adcfc38ad5086289df34a131a9529ed84dff3')throw new Error('Wrong observer; do not cancel');
          if(old.status!=='completed'){
            const r=await fetch(root+'actions/runs/36779610857/cancel',{method:'POST',headers});
            if(r.status!==202&&r.status!==409)throw new Error('Observer cleanup failed '+r.status);
            console.log('Stopped redundant read-only observer after verified SAME Apple upload');
          }else console.log('Observer already completed');
          NODE
