name: Apply T8 Active Drive foreground reconcile patch

on:
  push:
    branches:
      - fix/audit-t8-active-drive-foreground-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-t8-active-drive-foreground-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact scoped replacements
        run: node scripts/apply-t8-active-drive-foreground-reconcile.mjs
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Verify Active Drive foreground reconcile
        run: npm run verify:t8-active-drive-foreground-reconcile
      - name: Verify Group Drive Phase 5 contract
        run: npm run verify:group-drive-phase-5
      - name: Expo doctor
        run: npx expo-doctor
      - name: Verify patch whitespace
        run: git diff --check
      - name: Remove temporary patch helper
        run: git rm scripts/apply-t8-active-drive-foreground-reconcile.mjs
      - name: Commit patched runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(t8): reconcile Active Drive on foreground"
          git push origin HEAD:fix/audit-t8-active-drive-foreground-reconcile

# Triggered after verifier assertions were aligned with the guarded runtime implementation.
