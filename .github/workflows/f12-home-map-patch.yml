name: Apply F12 Home Map patch

on:
  push:
    branches:
      - perf/audit-f12-home-map

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/audit-f12-home-map
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Home Map patch
        run: node scripts/apply-f12-home-map-patch.mjs
      - name: Commit patched Home Map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/index.tsx'
          git diff --cached --check
          git commit -m "perf(home): reduce live driver refresh load"
          git push origin HEAD:perf/audit-f12-home-map
