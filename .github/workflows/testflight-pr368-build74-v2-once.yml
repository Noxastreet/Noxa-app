name: TestFlight PR368 Next Build Once

on:
  push:
    branches:
      - ci/testflight-pr368-build74-v2-20261001
    paths:
      - .github/workflows/testflight-pr368-build74-v2-once.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: testflight-pr368-build74-once-20261001
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build exact PR368 candidate and submit same IPA
    if: ${{ github.run_attempt == 1 }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CI: "1"
      EXPECTED_CANDIDATE_SHA: "f6bd16aab67889830308c375bc2a67bc7ecf69e1"
      EXPECTED_PR: "368"
      EXPECTED_MAIN_SHA: "879bf6681f88a1a4756abd5ce9ce13130bbab3c6"
      EXPECTED_BUNDLE_ID: "com.karaketidis.noxa"
      EXPECTED_EXTENSION_BUNDLE_ID: "com.karaketidis.noxa.driveactivity"
      EXPECTED_APP_VERSION: "1.0.0"
      EXPO_APPLE_TEAM_ID: "V8H92SG76B"
      EXPO_APPLE_TEAM_TYPE: "INDIVIDUAL"
      EXPECTED_WORKFLOW_PATH: ".github/workflows/testflight-pr368-build74-v2-once.yml"
      IPA_PATH: "${{ github.workspace }}/artifacts/noxa-pr368-next-${{ github.run_id }}.ipa"

    steps:
      - name: Check out delivery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove delivery branch is candidate plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_CANDIDATE_SHA" HEAD
          CHANGED="$(git diff --name-only "$EXPECTED_CANDIDATE_SHA" HEAD)"
          test "$CHANGED" = "$EXPECTED_WORKFLOW_PATH"

      - name: Require exact open PR, unchanged main, green Quality, and native audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/Noxastreet/Noxa-app/branches/main --jq '.commit.sha')" = "$EXPECTED_MAIN_SHA"

          gh api repos/Noxastreet/Noxa-app/pulls/$EXPECTED_PR > "$RUNNER_TEMP/pr.json"
          node - <<'NODE'
          const fs = require('fs');
          const pr = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pr.json','utf8'));
          if (pr.state !== 'open') throw new Error('PR #368 is not open');
          if (pr.head.sha !== process.env.EXPECTED_CANDIDATE_SHA) throw new Error('PR #368 head changed');
          if (pr.base.ref !== 'main' || pr.base.sha !== process.env.EXPECTED_MAIN_SHA) throw new Error('PR #368 base changed');
          console.log('Exact PR candidate confirmed:', pr.head.sha);
          NODE

          gh api "repos/Noxastreet/Noxa-app/actions/runs?head_sha=$EXPECTED_CANDIDATE_SHA&per_page=30"             --jq '.workflow_runs[] | select(.name == "Quality" and .event == "pull_request" and .status == "completed" and .conclusion == "success") | .id'             > "$RUNNER_TEMP/quality-success"
          test -s "$RUNNER_TEMP/quality-success"

          gh api repos/Noxastreet/Noxa-app/actions/runs/36799172270 > "$RUNNER_TEMP/native-audit.json"
          node - <<'NODE'
          const fs = require('fs');
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/native-audit.json','utf8'));
          if (run.name !== 'NOXA Drive Live Activity native audit once') throw new Error('Wrong native audit');
          if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Native audit not green');
          console.log('Native compile audit confirmed:', run.id);
          NODE

      - name: Check out exact product candidate
        uses: actions/checkout@v4
        with:
          ref: f6bd16aab67889830308c375bc2a67bc7ecf69e1
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-run release-critical static gates
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run lint
          npx expo-doctor
          npm run verify:ios-live-activity

      - name: Verify production build sequence before increment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@24.7.0 build:version:get --platform ios --profile production --non-interactive --json > "$RUNNER_TEMP/remote-version.json"
          node - <<'NODE'
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/remote-version.json','utf8'));
          const current = Number(v.buildNumber);
          if (!Number.isInteger(current) || current < 1) throw new Error('Invalid remote production build number: ' + v.buildNumber);
          const next = current + 1;
          fs.appendFileSync(process.env.GITHUB_ENV, 'PREVIOUS_BUILD_NUMBER=' + current + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'EXPECTED_BUILD_NUMBER=' + next + '\n');
          console.log('Remote production build confirmed:', current, 'next signed candidate:', next);
          NODE

      - name: Build signed production IPA locally once
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$IPA_PATH")"
          npx --yes eas-cli@24.7.0 build --platform ios --profile production --local --non-interactive --output "$IPA_PATH"
          test -f "$IPA_PATH"
          ls -lh "$IPA_PATH"

      - name: Verify app and Live Activity extension inside exact IPA
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          unzip -q "$IPA_PATH" -d "$TMP_DIR"

          APP_DIR="$(find "$TMP_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_DIR"
          APP_INFO="$APP_DIR/Info.plist"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")"
          LIVE_ACTIVITIES="$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP_INFO")"

          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"
          test "$APP_VERSION" = "$EXPECTED_APP_VERSION"
          test "$BUILD_NUMBER" = "$EXPECTED_BUILD_NUMBER"
          test "$LIVE_ACTIVITIES" = "true"

          EXT_DIR="$(find "$APP_DIR/PlugIns" -maxdepth 1 -type d -name '*.appex' -print -quit)"
          test -n "$EXT_DIR"
          EXT_INFO="$EXT_DIR/Info.plist"
          EXT_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_INFO")"
          EXT_POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT_INFO")"

          test "$EXT_BUNDLE_ID" = "$EXPECTED_EXTENSION_BUNDLE_ID"
          test "$EXT_POINT" = "com.apple.widgetkit-extension"

          codesign --verify --deep --strict "$APP_DIR"
          codesign --verify --strict "$EXT_DIR"

          mkdir -p artifacts
          shasum -a 256 "$IPA_PATH" > artifacts/ipa-sha256.txt
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('artifacts/ipa-metadata.json', JSON.stringify({
            source: process.env.EXPECTED_CANDIDATE_SHA,
            pr: Number(process.env.EXPECTED_PR),
            bundle: process.env.EXPECTED_BUNDLE_ID,
            extensionBundle: process.env.EXPECTED_EXTENSION_BUNDLE_ID,
            version: process.env.EXPECTED_APP_VERSION,
            build: process.env.EXPECTED_BUILD_NUMBER,
            liveActivities: true
          }, null, 2));
          NODE

          echo "VERIFIED signed IPA: $BUNDLE_ID $APP_VERSION ($BUILD_NUMBER)"
          echo "VERIFIED Widget Extension: $EXT_BUNDLE_ID / $EXT_POINT"

      - name: Preserve exact IPA and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: noxa-pr368-next-ipa-${{ github.run_id }}
          path: |
            artifacts/noxa-pr368-next-${{ github.run_id }}.ipa
            artifacts/ipa-metadata.json
            artifacts/ipa-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Submit exact preserved IPA to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@24.7.0 submit --platform ios --profile production --path "$IPA_PATH" --non-interactive 2>&1 | tee artifacts/testflight-submit.log

      - name: Preserve submission log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noxa-pr368-next-submit-${{ github.run_id }}
          path: artifacts/testflight-submit.log
          if-no-files-found: warn
          retention-days: 7

