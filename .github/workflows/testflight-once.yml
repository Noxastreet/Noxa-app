name: NOXA Submission Detail

on:
  push:
    branches:
      - ops/testflight-20260927
    paths:
      - .github/workflows/testflight-once.yml

permissions:
  contents: read

jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out NOXA
        uses: actions/checkout@v4
        with:
          ref: f4902006bab76026324c178166e6237834a62bb4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Submission detail
        run: npx --yes eas-cli@latest submit:view 6adc387c-8b49-4722-a10b-52329082805b --json
