name: NOXA TestFlight Build

on:
  push:
    branches:
      - ops/testflight-20260927
    paths:
      - .github/workflows/testflight-once.yml

permissions:
  contents: read

jobs:
  build-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out canonical NOXA main
        uses: actions/checkout@v4
        with:
          ref: 60534824c902c7a1456e903bf0af10c0c61646c3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo authentication
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::GitHub secret EXPO_TOKEN is not configured."
            exit 1
          fi
          npx --yes eas-cli@latest whoami

      - name: Build iOS production and submit to TestFlight
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --auto-submit
