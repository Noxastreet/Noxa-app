name: NOXA TestFlight Inspect

on:
  push:
    branches:
      - ops/testflight-20260927
    paths:
      - .github/workflows/testflight-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out NOXA
        uses: actions/checkout@v4
        with:
          ref: 60534824c902c7a1456e903bf0af10c0c61646c3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Project status
        run: npx --yes eas-cli@latest status --json --limit 10
      - name: Recent workflow runs
        run: npx --yes eas-cli@latest workflow:runs --json --limit 20
