name: NOXA TestFlight Status Check

on:
  push:
    branches:
      - ops/testflight-ui-root-20260929
    paths:
      - .github/workflows/testflight-once.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out canonical NOXA main
        uses: actions/checkout@v4
        with:
          ref: 1901527edf2d315b569a2f3f66ac053e462d38d6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: View EAS submission
        run: npx --yes eas-cli@latest submit:view 9eef596e-df78-4bdd-9e13-7a4590ded910 --json

      - name: View TestFlight status
        run: npx --yes eas-cli@latest submit:status --platform ios --profile production --json --non-interactive
