name: NOXA EAS Submit Diagnostics

on:
  push:
    branches:
      - ops/testflight-ui-root-20260929
    paths:
      - .github/workflows/testflight-once.yml

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out canonical NOXA main
        uses: actions/checkout@v4
        with:
          ref: 1901527edf2d315b569a2f3f66ac053e462d38d6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: List recent iOS submissions
        run: npx --yes eas-cli@latest submit:list --platform ios --limit 20 --json --non-interactive

      - name: Project status snapshot
        run: npx --yes eas-cli@latest status --json --limit 20 --non-interactive
