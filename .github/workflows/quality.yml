name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Group Drive Phase 1 static contract
        run: npm run verify:group-drive-phase-1

      - name: Group Drive Phase 1 local database smoke
        run: npm run test:group-drive-phase-1

      - name: Group Drive Phase 2 contract
        run: npm run verify:group-drive-phase-2

      - name: Group Drive Phase 3A static contract
        run: npm run verify:group-drive-phase-3a

      - name: Group Drive Phase 3A simulation smoke
        run: npm run test:group-drive-phase-3a

      - name: Group Drive Phase 4A static contract
        run: npm run verify:group-drive-phase-4a

      - name: Group Drive Phase 4A route progress smoke
        run: npm run test:group-drive-phase-4a
