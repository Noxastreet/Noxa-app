name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Expo doctor
        run: npx expo-doctor

      - name: Auth flow contract
        run: npm run verify:auth-flow

      - name: Delete Account storage-order contract
        run: node ./scripts/verify-delete-account-flow.mjs

      - name: Supabase migration history contract
        run: npm run verify:supabase-migrations

      - name: Interaction wiring audit
        run: npm run verify:interactions

      - name: NOXA UI foundation contract
        run: npm run verify:ui-foundation

      - name: NOXA accessibility and interrupted-control smoke
        run: node ./scripts/test-ui-accessibility-interruption.mjs

      - name: NOXA surface accessibility contract
        run: node ./scripts/verify-surface-accessibility.mjs

      - name: NOXA social root response ownership smoke
        run: node ./scripts/test-root-social-load-ownership.mjs

      - name: NOXA vehicle image recovery smoke
        run: node ./scripts/test-vehicle-image-recovery.mjs

      - name: NOXA root-screen visual system contract
        run: npm run verify:ui-root-screens

      - name: NOXA motion foundation contract
        run: npm run verify:motion-foundation

      - name: NOXA detail navigation motion contract
        run: npm run verify:motion-detail-navigation

      - name: NOXA premium action-sheet motion contract
        run: npm run verify:motion-action-sheet

      - name: Chat latest-window contract
        run: node ./scripts/verify-chat-window.mjs

      - name: Live Drive initial-presence contract
        run: node ./scripts/verify-live-drive-presence.mjs

      - name: Live Drive offline-stop smoke
        run: node ./scripts/test-live-drive-offline-stop.mjs

      - name: Map location revocation contract
        run: node ./scripts/verify-map-location-revocation.mjs

      - name: Home / Map progressive disclosure contract
        run: npm run verify:home-map-disclosure

      - name: Navigation focus and live route progress contract
        run: npm run verify:navigation-focus

      - name: Route motion continuity contract
        run: npm run verify:route-motion-continuity

      - name: Map driver contextual card contract
        run: npm run verify:map-driver-card

      - name: Map selected driver marker contract
        run: npm run verify:map-selected-driver

      - name: Map camera ownership contract
        run: npm run verify:map-camera-ownership

      - name: Map object focus sequencing contract
        run: npm run verify:map-object-focus

      - name: Home / Map F12 performance contract
        run: npm run verify:home-map-performance

      - name: App data-loading performance contract
        run: node ./scripts/verify-app-data-loading.mjs

      - name: Notifications reliability contract
        run: node ./scripts/verify-notifications-reliability.mjs

      - name: Post flow reliability contract
        run: node ./scripts/verify-post-flow-reliability.mjs

      - name: Editor save navigation contract
        run: node ./scripts/verify-editor-save-navigation.mjs

      - name: Social list stale-response contract
        run: node ./scripts/verify-social-list-race.mjs

      - name: Quick Connect static contract
        run: npm run verify:quick-connect

      - name: Quick Connect motion continuity contract
        run: npm run verify:quick-connect-motion

      - name: Quick Connect database smoke
        run: npm run test:quick-connect

      - name: Owned media cleanup contract
        run: node ./scripts/verify-media-cleanup.mjs

      - name: Crew lifecycle UX contract
        run: node ./scripts/verify-crew-lifecycle-ux.mjs

      - name: Group Drive invitation push contract
        run: node ./scripts/verify-group-drive-invitation-push.mjs

      - name: Group Drive account isolation smoke
        run: node ./scripts/test-group-drive-account-isolation.mjs

      - name: Group Drive Phase 1 static contract
        run: npm run verify:group-drive-phase-1

      - name: Group Drive Phase 1 local database smoke
        run: npm run test:group-drive-phase-1

      - name: Drive Together map-first static contract
        run: npm run verify:drive-together-quickflow

      - name: Event / Drive Together bridge contract
        run: npm run verify:event-drive-together

      - name: iOS Drive Together Live Activity contract
        run: npm run verify:ios-live-activity

      - name: Drive Together local database smoke
        run: npm run test:drive-together-quickflow

      - name: Group Drive Phase 2 contract
        run: npm run verify:group-drive-phase-2

      - name: Group Drive end-to-end UX contract
        run: node ./scripts/verify-group-drive-end-to-end-ux.mjs

      - name: Group Drive Phase 3A static contract
        run: npm run verify:group-drive-phase-3a

      - name: Group Drive Phase 3A simulation smoke
        run: npm run test:group-drive-phase-3a

      - name: Group Drive Phase 3B static contract
        run: npm run verify:group-drive-phase-3b

      - name: Group Drive Phase 3B deterministic native smoke
        run: npm run test:group-drive-phase-3b

      - name: Group Drive Phase 4A static contract
        run: npm run verify:group-drive-phase-4a

      - name: Group Drive Phase 4A route progress smoke
        run: npm run test:group-drive-phase-4a

      - name: Group Drive Phase 4B static contract
        run: npm run verify:group-drive-phase-4b

      - name: Group Drive Phase 4B participant presentation smoke
        run: npm run test:group-drive-phase-4b

      - name: Group Drive Phase 4C static contract
        run: npm run verify:group-drive-phase-4c

      - name: Group Drive Phase 4C composition smoke
        run: npm run test:group-drive-phase-4c

      - name: Group Drive Phase 5 completion contract
        run: npm run verify:group-drive-phase-5

      - name: MVP completion and privacy contract
        run: npm run verify:mvp-completion
