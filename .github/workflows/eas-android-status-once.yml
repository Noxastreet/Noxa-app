name: NOXA EAS Android Status Once

on:
  push:
    branches:
      - fix/release-blockers-20261003
    paths:
      - .github/workflows/eas-android-status-once.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a4d687f6d4ea45d011cba53ba57b571fe276a4c
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show latest Android EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@24.7.0 build:list --platform android --limit 5 --json > "$RUNNER_TEMP/builds.json"
          cat "$RUNNER_TEMP/builds.json"
          node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/builds.json','utf8'));
          const target = list.find(b => b.gitCommitHash === '3a4d687f6d4ea45d011cba53ba57b571fe276a4c') || list[0];
          if (!target) throw new Error('No Android EAS build found');
          const url = target.buildDetailsPageUrl || ('https://expo.dev/accounts/noxastreet/projects/Noxa/builds/' + target.id);
          console.log('TARGET_BUILD_ID=' + target.id);
          console.log('TARGET_STATUS=' + target.status);
          console.log('TARGET_URL=' + url);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Latest NOXA Android EAS build\n' +
            '- Build ID: ' + target.id + '\n' +
            '- Status: ' + target.status + '\n' +
            '- Page: ' + url + '\n');
          NODE
