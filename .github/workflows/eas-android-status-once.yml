name: NOXA EAS Android Status Once

on:
  push:
    branches:
      - fix/release-blockers-20261003
    paths:
      - .github/workflows/eas-android-status-once.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a4d687f6d4ea45d011cba53ba57b571fe276a4c
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose latest Android EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set +e
          npx --yes eas-cli@24.7.0 build:list --platform android --limit 5 --json 2>&1 | tee "$RUNNER_TEMP/eas-status.txt"
          CODE=${PIPESTATUS[0]}
          echo "EAS_EXIT_CODE=$CODE"
          cat "$RUNNER_TEMP/eas-status.txt"
          exit 0
