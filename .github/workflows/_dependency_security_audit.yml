name: Dependency Security Audit

on:
  push:
    branches:
      - audit/dependencies-20260914

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: NPM audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-prod.json
          status=$?
          echo "PROD_AUDIT_EXIT=$status"
          cat npm-audit-prod.json
          exit 0

      - name: NPM audit full tree
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-full.json
          status=$?
          echo "FULL_AUDIT_EXIT=$status"
          cat npm-audit-full.json
          exit 0

      - name: Outdated direct dependencies
        shell: bash
        run: |
          set +e
          npm outdated --json > npm-outdated.json
          status=$?
          echo "OUTDATED_EXIT=$status"
          cat npm-outdated.json
          exit 0

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: |
            npm-audit-prod.json
            npm-audit-full.json
            npm-outdated.json
