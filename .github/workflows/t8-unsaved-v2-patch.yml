name: Apply T8 unsaved editor patch v2

on:
  push:
    branches:
      - fix/audit-t8-unsaved-editors-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-t8-unsaved-editors-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact scoped replacements
        run: node scripts/apply-t8-unsaved-editors-v2.mjs
      - name: Verify T8 unsaved-editor contract
        run: node scripts/verify-t8-unsaved-editors.mjs
      - name: Verify patch whitespace
        run: git diff --check
      - name: Remove temporary patch helper
        run: git rm scripts/apply-t8-unsaved-editors-v2.mjs
      - name: Commit patched runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(t8): guard unsaved editor navigation"
          git push origin HEAD:fix/audit-t8-unsaved-editors-v2
