name: Hold candidate 72 pending native-evidenced action label correction
on:
  push:
    branches: [ci/noxa-hold72-label-review-20260930]
    paths: [.github/workflows/noxa-hold72-label-review-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  hold:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stop only pre-submit candidate workflow; never interrupt an already scheduled submission
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/Noxastreet/Noxa-app/';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function get(path){const r=await fetch(root+path,{headers});if(!r.ok)throw new Error('Evidence read failed '+r.status);return r.json();}
          const run=await get('actions/runs/36781854889');
          if(run.head_sha!=='116bf19401a7cead583132d01b57ec3245e61272')throw new Error('Wrong candidate workflow');
          const jobs=(await get('actions/runs/36781854889/jobs')).jobs;
          const job=jobs.find(j=>j.name==='Validate same IPA 72 and submit once');
          const submit=job?.steps?.find(s=>s.name==='Submit the preserved IPA exactly once without waiting in macOS queue');
          if(submit&&submit.status!=='pending'&&submit.conclusion!=='skipped'){
            console.log('Submission may already be scheduled; leave same-ID monitor running and mark 72 superseded');process.exit(0);
          }
          if(run.status!=='completed'){
            const r=await fetch(root+'actions/runs/36781854889/cancel',{method:'POST',headers});
            if(r.status!==202&&r.status!==409)throw new Error('Candidate hold failed '+r.status);
            console.log('Held pre-submit candidate 72 for actual native action-label truncation correction');
          }else console.log('Candidate workflow already completed; inspect existing submission evidence');
          NODE
