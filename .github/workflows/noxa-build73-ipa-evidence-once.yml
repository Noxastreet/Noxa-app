name: Verify preserved build 73 IPA independently
on:
  push:
    branches: [ci/noxa-build73-ipa-evidence-20260930]
    paths: [.github/workflows/noxa-build73-ipa-evidence-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.run_attempt == 1 }}
    env:
      SOURCE_SHA: "879bf6681f88a1a4756abd5ce9ce13130bbab3c6"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the already preserved IPA and current main
        run: |
          test "$(gh api repos/Noxastreet/Noxa-app/actions/runs/36783662748 --jq '.head_sha')" = "8870ba052354ec06095be272265bd54df508d2db"
          gh api repos/Noxastreet/Noxa-app/actions/runs/36783662748/artifacts --jq '.artifacts[] | select(.name=="noxa-build73-ipa-36783662748" and .expired==false) | .id' > artifact-id.txt
          test "$(wc -l < artifact-id.txt | tr -d ' ')" = "1"
          gh run download 36783662748 --repo Noxastreet/Noxa-app --name noxa-build73-ipa-36783662748 --dir ipa-evidence
          gh api repos/Noxastreet/Noxa-app/branches/main --jq '.commit.sha' > current-main.txt
      - name: Validate bytes, embedded plist and recorded source
        run: |
          python3 <<'PY'
          import glob, hashlib, json, os, plistlib, re, zipfile
          from pathlib import Path
          paths=glob.glob('ipa-evidence/*.ipa')
          assert len(paths)==1, 'Expected the same single preserved IPA'
          with open(paths[0],'rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
          recorded=Path('ipa-evidence/ipa-sha256.txt').read_text().split()[0]
          assert digest==recorded, 'Preserved IPA bytes changed'
          source=json.loads(Path('ipa-evidence/ipa-metadata.json').read_text())
          assert source['source']==os.environ['SOURCE_SHA']
          assert Path('current-main.txt').read_text().strip()==os.environ['SOURCE_SHA']
          with zipfile.ZipFile(paths[0]) as archive:
              infos=[p for p in archive.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist',p)]
              assert len(infos)==1
              info=plistlib.loads(archive.read(infos[0]))
          assert info['CFBundleIdentifier']=='com.karaketidis.noxa'
          assert info['CFBundleShortVersionString']=='1.0.0'
          assert str(info['CFBundleVersion'])=='73'
          evidence={'source':source['source'],'bundle':info['CFBundleIdentifier'],'version':info['CFBundleShortVersionString'],'build':str(info['CFBundleVersion']),'ipaSHA256':digest,'artifactId':int(Path('artifact-id.txt').read_text().strip()),'deliveryRun':36783662748,'preservedBytesMatchRunner':True}
          Path('ipa-integrity-evidence.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence))
          PY
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:'ipa-integrity-evidence.json',branch:'ci/noxa-build73-ipa-evidence-20260930',message:'evidence: independently verified exact-source preserved production IPA',content:fs.readFileSync('ipa-integrity-evidence.json').toString('base64')});
