name: Patch notification center

on:
  push:
    branches:
      - codex/group-drive-ux-simplification-20260902
    paths:
      - scripts/patch-notification-center.mjs
      - .github/workflows/patch-notification-center.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/group-drive-ux-simplification-20260902
          fetch-depth: 0
      - run: node scripts/patch-notification-center.mjs
      - name: Commit notification center
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/notifications.tsx
          git commit -m "feat(notifications): consolidate feed and add Group Drive invites"
          git push origin HEAD:codex/group-drive-ux-simplification-20260902
