name: EAS iOS Credential Schema Once

on:
  push:
    branches:
      - ci/testflight-pr368-build75-signing-20261001
    paths:
      - .github/workflows/eas-ios-credential-schema-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect EAS credential schema and non-secret credential IDs
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/inspect.mjs" <<'NODE'
          const endpoint = 'https://api.expo.dev/graphql';
          const token = process.env.EXPO_TOKEN;
          if (!token) throw new Error('EXPO_TOKEN missing');

          async function gql(query, variables = {}) {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ query, variables }),
            });
            const json = await res.json();
            if (!res.ok || json.errors) {
              throw new Error(JSON.stringify(json.errors ?? json, null, 2));
            }
            return json.data;
          }

          const schema = await gql(`
            query {
              buildInput: __type(name: "IosAppBuildCredentialsInput") {
                inputFields {
                  name
                  type { kind name ofType { kind name } }
                }
              }
              appInput: __type(name: "IosAppCredentialsInput") {
                inputFields {
                  name
                  type { kind name ofType { kind name } }
                }
              }
            }
          `);
          console.log('SCHEMA', JSON.stringify(schema, null, 2));

          const account = await gql(`
            query CredentialInventory($accountName: String!, $main: String!, $ext: String!) {
              account {
                byName(accountName: $accountName) {
                  id
                  main: appleAppIdentifiers(bundleIdentifier: $main) {
                    id
                    bundleIdentifier
                    appleTeam { id appleTeamIdentifier appleTeamName }
                  }
                  ext: appleAppIdentifiers(bundleIdentifier: $ext) {
                    id
                    bundleIdentifier
                    appleTeam { id appleTeamIdentifier appleTeamName }
                  }
                  appleDistributionCertificatesPaginated(first: 20) {
                    edges {
                      node {
                        id
                        serialNumber
                        developerPortalIdentifier
                        validityNotAfter
                        appleTeam { id appleTeamIdentifier appleTeamName }
                      }
                    }
                  }
                }
              }
            }
          `, {
            accountName: 'noxastreet',
            main: 'com.karaketidis.noxa',
            ext: 'com.karaketidis.noxa.driveactivity',
          });
          console.log('ACCOUNT', JSON.stringify(account, null, 2));

          const ids = account.account.byName;
          const mainId = ids.main?.[0]?.id;
          const extId = ids.ext?.[0]?.id;
          if (!mainId || !extId) throw new Error('Expected Apple app identifiers are missing');

          const creds = await gql(`
            query AppCredentials($fullName: String!, $mainId: String!, $extId: String!) {
              app {
                byFullName(fullName: $fullName) {
                  id
                  main: iosAppCredentials(filter: { appleAppIdentifierId: $mainId }) {
                    id
                    appleTeam { id appleTeamIdentifier appleTeamName }
                    appleAppIdentifier { id bundleIdentifier }
                    iosAppBuildCredentialsList {
                      id
                      iosDistributionType
                      distributionCertificate {
                        id
                        serialNumber
                        developerPortalIdentifier
                      }
                      provisioningProfile {
                        id
                        developerPortalIdentifier
                      }
                    }
                  }
                  ext: iosAppCredentials(filter: { appleAppIdentifierId: $extId }) {
                    id
                    appleTeam { id appleTeamIdentifier appleTeamName }
                    appleAppIdentifier { id bundleIdentifier }
                    iosAppBuildCredentialsList {
                      id
                      iosDistributionType
                      distributionCertificate {
                        id
                        serialNumber
                        developerPortalIdentifier
                      }
                      provisioningProfile {
                        id
                        developerPortalIdentifier
                      }
                    }
                  }
                }
              }
            }
          `, {
            fullName: '@noxastreet/Noxa',
            mainId,
            extId,
          });
          console.log('CREDS', JSON.stringify(creds, null, 2));
          NODE
          node "$RUNNER_TEMP/inspect.mjs"
