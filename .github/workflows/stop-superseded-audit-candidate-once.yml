name: Stop superseded audit candidate before upload
on:
  push:
    branches: [ci/stop-superseded-audit-candidate-20260930]
    paths: [.github/workflows/stop-superseded-audit-candidate-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.run_attempt == 1 }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runId=36751501878;
            const run=(await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:runId})).data;
            if(run.head_sha!=='b81173dcbf98eb3b90826311a6c2b39f54d97c1b')throw new Error('Wrong delivery run; refuse cancellation');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:runId})).data.jobs;
            console.log('Candidate jobs:',JSON.stringify(jobs.map(j=>({status:j.status,steps:j.steps.map(s=>({name:s.name,status:s.status,conclusion:s.conclusion}))}))));
            if(jobs.some(j=>j.steps.some(s=>s.name.startsWith('Submit the preserved IPA')&&s.status!=='pending'&&s.status!=='queued')))throw new Error('Submission has already started; monitor that same submission instead of cancelling');
            await github.rest.actions.cancelWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:runId});
            console.log('Cancelled superseded candidate before EAS Submit. Remote sequence will be re-read.');
