name: Patch profile media fallback

on:
  push:
    branches:
      - codex/group-drive-ux-simplification-20260902
    paths:
      - scripts/patch-profile-media-fallback.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/group-drive-ux-simplification-20260902
          fetch-depth: 0
      - run: node scripts/patch-profile-media-fallback.mjs
      - name: Commit profile fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/profile.tsx'
          git diff --cached --quiet && exit 0
          git commit -m "refactor(profile): simplify missing vehicle artwork"
          git push origin HEAD:codex/group-drive-ux-simplification-20260902